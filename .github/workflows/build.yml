name: Build MSX ROMs from source
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check completeness of canonical graphics
        run: |
          python - <<'PY'
          from pathlib import Path
          required = ["player_exact.png","player_explosion20.png","player_explosion21.png","player_explosion22.png","popcorn102.png","popcorn103.png","sentinel180.png","sentinel235.png","shot_backslash_front.png","shot_backslash_rear.png","shot_h_front.png","shot_h_rear.png","shot_slash_front.png","shot_slash_rear.png","shot_v_front.png","shot_v_rear.png","stage1_map.png","stars_native.png"]
          missing = [f"res/canonical/{n}" for n in required if not (Path("res/canonical") / n).is_file()]
          if missing:
              print(f"ERROR: {len(missing)} required source graphics are absent from GitHub:")
              for name in missing: print(f"  MISSING {name}")
              print("A local ZIP is NOT an adequate substitute for files in this repository.")
              raise SystemExit(1)
          print("All 18 formerly missing canonical graphics are present.")
          PY
      - run: python -m pip install Pillow
      - name: Build from sources
        run: |
          if ! bash build.sh; then
            echo '=== packer warnings / traceback ==='
            if [ -f validation/PACK_WARNINGS.log ]; then tail -n 100 validation/PACK_WARNINGS.log; fi
            echo '=== assembly output ==='
            if [ -f validation/ASSEMBLY.log ]; then tail -n 100 validation/ASSEMBLY.log; fi
            exit 1
          fi
      - name: Check original FIX03 ROM hashes
        run: |
          echo '8148b4c0406e836024acf14de8c7a7bf9c3e491d6b3d18878fed13a86fdd6053  out/VOLCABAMBA_MSX2_TURBOR_HYBRID_H02.rom' | sha256sum -c -
          echo '94c6fa97c5e31828a5c0a4b6bfa2f24810f93b5c3eb5f599b478c6e617ca5cab  out/VOLCABAMBA_MSX_TURBOR_ONLY_H02.rom' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: volcabamba-build-and-diagnostics
          path: |
            out/*.rom
            validation/
          if-no-files-found: warn
