name: Build MSX ROMs from source
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check source availability
        run: |
          if [ ! -f build.sh ]; then echo '::notice::SOURCE not imported yet; upload full Volcabamba handoff package.'; fi
      - uses: actions/setup-python@v5
        if: ${{ hashFiles('build.sh') != '' }}
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
        if: ${{ hashFiles('build.sh') != '' }}
      - run: bash build.sh
        if: ${{ hashFiles('build.sh') != '' }}
      - name: Verify reproducible FIX03 safe ROMs
        if: ${{ hashFiles('build.sh') != '' }}
        run: |
          echo '8148b4c0406e836024acf14de8c7a7bf9c3e491d6b3d18878fed13a86fdd6053  out/VOLCABAMBA_MSX2_TURBOR_HYBRID_H02.rom' | sha256sum -c -
          echo '94c6fa97c5e31828a5c0a4b6bfa2f24810f93b5c3eb5f599b478c6e617ca5cab  out/VOLCABAMBA_MSX_TURBOR_ONLY_H02.rom' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('out/*.rom') != '' }}
        with:
          name: volcabamba-fix03-roms
          path: out/*.rom
